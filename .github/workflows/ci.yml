name: xBlueNode CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'axpoint-core/**'
              - 'deploy/migrations/**'
              - 'templates/**'
              - 'tests/cassettes/**'
              - 'tests/data/**'
              - 'xbluenode-web/src/lib/chartSpec.json'
              - 'scripts/lint-guard.py'
              - 'scripts/hallucination-guard.py'
              - '.github/workflows/ci.yml'
            python:
              - 'axpoint-parser/**'
              - 'deploy/migrations/**'
              - 'tests/data/**'
              - 'scripts/python-guard.py'
              - '.github/workflows/ci.yml'
            web:
              - 'xbluenode-web/**'
              - 'scripts/web-guard.py'
              - '.github/workflows/ci.yml'

  rust-core:
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: axpoint
          POSTGRES_PASSWORD: axpoint_secret
          POSTGRES_DB: xbluenode
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U axpoint -d xbluenode" --health-interval 5s --health-retries 20
    env:
      MIGRATION_DATABASE_URL: postgres://axpoint:axpoint_secret@localhost:5432/xbluenode
      DATABASE_URL: postgres://axpoint_app:axpoint_app_secret@localhost:5432/xbluenode
      AXPOINT_LAKE_CATALOG_DSN: postgres://axpoint_lake:axpoint_lake_secret@localhost:5432/xbluenode
      AXPOINT_REQUIRE_DB_TESTS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CC: ccache gcc
      CXX: ccache g++
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
    steps:
      - name: Reclaim Runner Disk Space & Ensure ccache
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ccache
          fi
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ccache
          key: ccache-duckdb-linux-amd64-${{ github.sha }}
          restore-keys: |
            ccache-duckdb-linux-amd64-
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: axpoint-core
      - name: Prune Oversized Legacy Debug Build Artifacts
        run: |
          if [ -d axpoint-core/target/debug/build ]; then
            find axpoint-core/target/debug/build -maxdepth 3 -name 'libduckdb.a' -size +1G -printf 'Pruning oversized %p\n' -exec dirname {} \; | xargs -r -I{} rm -rf "{}/.."
          fi
      - uses: actions/cache@v4
        with:
          path: ~/.duckdb/extensions
          key: duckdb-ext-v2.0.0-linux-amd64
      - name: Install DuckDB v2.0.0 Extensions
        run: |
          if [ ! -f "$HOME/.duckdb/extensions/v2.0.0/linux_amd64/ducklake.duckdb_extension" ] && [ ! -f "$HOME/.duckdb/extensions/v2.0.0/linux_amd64_gcc4/ducklake.duckdb_extension" ]; then
            python3 -m venv /tmp/ddb-ext
            /tmp/ddb-ext/bin/pip install --quiet "duckdb==2.0.*"
            /tmp/ddb-ext/bin/python -c "import duckdb; con = duckdb.connect(); con.execute('INSTALL ducklake; INSTALL postgres; INSTALL mysql_scanner; INSTALL sqlite_scanner;')"
          fi
      - name: Install sqlx-cli
        run: |
          if ! command -v sqlx >/dev/null 2>&1; then
            CC=gcc CXX=g++ cargo install sqlx-cli --version ^0.9 --no-default-features --features rustls,postgres --locked
          fi
      - name: Run Database Migrations
        run: |
          sqlx migrate run --source deploy/migrations --database-url "$MIGRATION_DATABASE_URL"
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE axpoint_app PASSWORD 'axpoint_app_secret'" \
            -c "ALTER ROLE axpoint_lake PASSWORD 'axpoint_lake_secret'"
      - name: Anti-Bypass Lint Guard, Format, Clippy, Docs & Tests
        working-directory: axpoint-core
        run: |
          python3 ../scripts/lint-guard.py
          rustc --version | grep -qF "rustc 1.100.0 "
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps --locked
          cargo test --workspace --locked -- --test-threads=1
          cargo test --workspace --doc --all-features --locked
          ccache -s || true

  python-parser:
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: axpoint
          POSTGRES_PASSWORD: axpoint_secret
          POSTGRES_DB: xbluenode
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U axpoint -d xbluenode" --health-interval 5s --health-retries 20
    env:
      MIGRATION_DATABASE_URL: postgres://axpoint:axpoint_secret@localhost:5432/xbluenode
      DATABASE_URL: postgres://axpoint_app:axpoint_app_secret@localhost:5432/xbluenode
      AXPOINT_LAKE_CATALOG_DSN: postgres://axpoint_lake:axpoint_lake_secret@localhost:5432/xbluenode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: axpoint-parser/charts/package-lock.json
      - name: Install WeasyPrint & Noto CJK System Libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            fonts-noto-cjk libpango-1.0-0 libpangocairo-1.0-0 libpangoft2-1.0-0 \
            libgdk-pixbuf-2.0-0 libcairo2 shared-mime-info
      - name: Initialize PostgreSQL Roles & Schemas
        run: |
          for f in deploy/migrations/*.sql; do
            psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE axpoint_app PASSWORD 'axpoint_app_secret'" \
            -c "ALTER ROLE axpoint_lake PASSWORD 'axpoint_lake_secret'"
      - name: Install Dependencies, Chart SSR Runtime & DuckDB Extensions
        working-directory: axpoint-parser
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install --no-deps "https://github.com/explosion/spacy-models/releases/download/zh_core_web_sm-3.8.0/zh_core_web_sm-3.8.0-py3-none-any.whl"
          npm --prefix charts ci --omit=dev
          python -c "import duckdb; con = duckdb.connect(); con.execute('INSTALL ducklake; INSTALL postgres; INSTALL mysql_scanner; INSTALL sqlite_scanner;')"
      - name: Lint, Typecheck & Tests
        working-directory: axpoint-parser
        run: |
          ruff check .
          mypy --strict .
          pytest -v -m "not heavy" tests

  web-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: xbluenode-web/package-lock.json
      - name: Install & Build
        working-directory: xbluenode-web
        run: |
          npm ci
          npm run build
      - name: Playwright Smoke Tests
        working-directory: xbluenode-web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/smoke.spec.ts

  naming-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Autonomous Naming, Anti-Bypass, Grounded AI & Docs/Contract Guards
        env:
          NAMING_DENYLIST: ${{ vars.NAMING_DENYLIST }}
        run: |
          bash scripts/naming-guard.sh
          python3 scripts/lint-guard.py
          python3 scripts/web-guard.py
          python3 scripts/python-guard.py
          python3 scripts/hallucination-guard.py
          python3 scripts/docs-and-plans-guard.py
          python3 scripts/check_routes.py --routes axpoint-core/crates/axpoint-server/src/routes --index docs/standards/A4-API-CONTRACT-INDEX.md
          python3 scripts/check_traceability.py docs/standards/A7-REQUIREMENTS-TRACEABILITY.md scripts/gate
          bash scripts/check-write-scope.sh --self-test
