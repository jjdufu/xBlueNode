name: xBlueNode CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'axpoint-core/**'
              - 'deploy/migrations/**'
              - 'tests/cassettes/**'
              - '.github/workflows/ci.yml'
            python:
              - 'axpoint-parser/**'
              - '.github/workflows/ci.yml'
            web:
              - 'xbluenode-web/**'
              - '.github/workflows/ci.yml'

  rust-core:
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: axpoint
          POSTGRES_PASSWORD: axpoint_secret
          POSTGRES_DB: xbluenode
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U axpoint -d xbluenode" --health-interval 5s --health-retries 20
    env:
      MIGRATION_DATABASE_URL: postgres://axpoint:axpoint_secret@localhost:5432/xbluenode
      DATABASE_URL: postgres://axpoint_app:axpoint_app_secret@localhost:5432/xbluenode
      AXPOINT_REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: axpoint-core
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version ^0.9 --no-default-features --features rustls,postgres --locked
      - name: Run Database Migrations
        run: |
          sqlx migrate run --source deploy/migrations --database-url "$MIGRATION_DATABASE_URL"
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE axpoint_app PASSWORD 'axpoint_app_secret'" \
            -c "ALTER ROLE axpoint_lake PASSWORD 'axpoint_lake_secret'"
      - name: Format, Clippy & Tests
        working-directory: axpoint-core
        run: cargo fmt --all -- --check && cargo clippy --workspace --all-targets -- -D warnings && cargo test --workspace -- --test-threads=1

  python-parser:
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        working-directory: axpoint-parser
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint, Typecheck & Tests
        working-directory: axpoint-parser
        run: |
          ruff check .
          mypy --strict .
          pytest -v tests

  web-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: xbluenode-web/package-lock.json
      - name: Install & Build
        working-directory: xbluenode-web
        run: |
          npm ci
          npm run build
      - name: Playwright Smoke Tests
        working-directory: xbluenode-web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/smoke.spec.ts

  naming-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Autonomous Naming Policy
        env:
          NAMING_DENYLIST: ${{ vars.NAMING_DENYLIST }}
        run: bash scripts/naming-guard.sh
