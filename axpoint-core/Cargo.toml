[workspace]
resolver = "3"
members = [
    "crates/axpoint-domain",
    "crates/axpoint-llm",
    "crates/axpoint-db",
    "crates/axpoint-security",
    "crates/axpoint-analytics",
    "crates/axpoint-flow",
    "crates/axpoint-agent",
    "crates/axpoint-server",
]

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
version = "0.2.0"
license = "Apache-2.0"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }
unused_imports = "deny"
unused_variables = "deny"
dead_code = "deny"
unused_must_use = "deny"
unused_mut = "deny"
unused_qualifications = "deny"
missing_docs = "deny"
elided_lifetimes_in_paths = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_unsafe_on_extern = "deny"
unsafe_attr_outside_unsafe = "deny"

[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }
missing_crate_level_docs = "deny"
unescaped_backticks = "deny"
private_doc_tests = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# 防绕过与属性锁死
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
blanket_clippy_restriction_lints = "deny"
cfg_not_test = "deny"
# 禁止崩溃、越界与未完成占位
unwrap_used = "deny"
expect_used = "deny"
get_unwrap = "deny"
todo = "deny"
unimplemented = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
# 禁止隐式/有损类型转换
as_conversions = "deny"
as_underscore = "deny"
as_pointer_underscore = "deny"
fn_to_numeric_cast_any = "deny"
lossy_float_literal = "deny"
# 禁止静默吞错与资源泄漏
let_underscore_must_use = "deny"
unused_result_ok = "deny"
mem_forget = "deny"
# 服务端生产卫生与并发安全
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
clone_on_copy = "deny"
infinite_loop = "deny"
# Tokio 异步持锁与高价值 Nursery 缺陷拦截
significant_drop_in_scrutinee = "deny"
non_send_fields_in_send_ty = "deny"
debug_assert_with_mut_call = "deny"
derive_partial_eq_without_eq = "deny"
empty_enums = "deny"
fallible_impl_from = "deny"
iter_on_empty_collections = "deny"
iter_on_single_items = "deny"
path_buf_push_overwrite = "deny"
read_zero_byte_vec = "deny"
suspicious_operation_groupings = "deny"
transmute_undefined_repr = "deny"
uninhabited_references = "deny"
# 文档契约与 unsafe 冗余防线
missing_errors_doc = "deny"
missing_panics_doc = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"

[workspace.dependencies]
aes-gcm = "0.11"
argon2 = "0.6"
arrow = { version = "60", default-features = false }
async-graphql = { version = "7.2", features = ["dynamic-schema", "dataloader"] }
async-graphql-axum = "7.2"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
cedar-policy = "4.14"
chrono = { version = "0.4", features = ["serde"] }
cron = "0.17"
dotenvy = "0.15"
duckdb = { version = "1.20000", features = ["bundled", "parquet", "json", "vtab-arrow", "vscalar", "vscalar-arrow"] }
eventsource-stream = "0.2"
futures = "0.3"
geo = { version = "0.29", default-features = false, features = ["use-serde"] }
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
hyperloglogplus = "0.4"
jsonschema = "0.61"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
lru = "0.16"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
moka = { version = "0.12", features = ["future"] }
openidconnect = "4.1"
opentelemetry = "0.33"
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
petgraph = "0.8"
pgvector = { version = "0.4", features = ["sqlx"] }
proptest = "1"
rand = "0.9"
rand_chacha = "0.9"
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
rmcp = { version = "3.10", default-features = false, features = ["server", "client", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "reqwest"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlparser = "0.64"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = "0.29"
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "limit", "request-id", "set-header", "compression-gzip"] }
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
webpki-roots = "1"
zeroize = { version = "1", features = ["derive"] }

[profile.dev]
debug = false

[profile.test]
debug = false

[profile.dev.package.libduckdb-sys]
debug = false

[profile.test.package.libduckdb-sys]
debug = false
