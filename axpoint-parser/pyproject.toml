[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axpoint-parser"
version = "0.1.0"
description = "Stateless PDF/OCR/Office document parsing sidecar for xBlueNode / AxPoint"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.12",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.4,<3",
    "httpx>=0.28,<1",
    "openpyxl==3.1.*",
    "python-pptx==1.0.*",
    "python-docx==1.2.*",
    "pypdf>=5",
    "lxml==6.1.*",
    "defusedxml==0.7.*",
    "orjson>=3.10",
    "reportlab>=4.2",
    "pillow>=10",
]

[project.optional-dependencies]
full = [
    "docling==2.150.*",
    "easyocr>=1.7,<2",
    "pymssql>=2.3,<3",
    "oracledb>=2",
    "dmPython>=2.5",
    "pyhive[hive_pure_sasl]>=0.7",
    "cassandra-driver>=3.29,<4",
    "happybase>=1.2,<2",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "respx>=0.21",
]

[tool.setuptools]
py-modules = ["main", "schemas", "settings", "security"]

[tool.setuptools.packages.find]
include = ["parsers*", "connectors*", "exporters*", "lake*", "charts*", "pii*"]
namespaces = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "defusedxml.*",
    "docling.*",
    "docx.*",
    "lxml.*",
    "openpyxl.*",
    "PIL.*",
    "pptx.*",
    "pypdf.*",
    "reportlab.*",
]
ignore_missing_imports = true
