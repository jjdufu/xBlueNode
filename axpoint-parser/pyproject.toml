[project]
name = "axpoint-parser"
version = "0.1.0"
description = "Stateless PDF/OCR/Office document parsing sidecar for xBlueNode / AxPoint"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
docling = [
    "docling>=2.0.0",
    "easyocr>=1.7.0",
    "python-docx>=1.1.0",
]

[tool.setuptools]
py-modules = ["main", "schemas"]
packages = ["parsers", "connectors", "exporters"]
