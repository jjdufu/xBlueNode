[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axpoint-parser"
version = "0.1.0"
description = "Stateless PDF/OCR/Office document parsing and connector sidecar for xBlueNode / AxPoint"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.12",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.4,<3",
    "duckdb==2.0.*",
    "polars==2.1.*",
    "pyarrow>=20",
    "python-calamine==0.9.*",
    "openpyxl==3.1.*",
    "python-pptx==1.0.*",
    "python-docx==1.2.*",
    "pypdf>=5",
    "lxml==6.1.*",
    "defusedxml==0.7.*",
    "orjson>=3.10",
    "ijson>=3.3",
    "charset-normalizer==3.5.*",
    "pypinyin>=0.53",
    "drain3==0.9.11",
    "genson==1.4.*",
    "pandera==0.36.*",
    "sqlalchemy==2.1.*",
    "connectorx==0.4.*",
    "sqlglot>=25",
    "psycopg[binary]>=3.2,<4",
    "pymysql>=1.1,<2",
    "clickhouse-connect==1.12.*",
    "pymongo==4.20.*",
    "redis==8.1.*",
    "elasticsearch==9.5.*",
    "neo4j>=5.26",
    "influxdb-client>=1.46",
    "influxdb3-python>=0.10",
    "taospy>=2.7",
    "apache-iotdb>=1.3",
    "confluent-kafka>=2.6,<3",
    "paho-mqtt>=2.1,<3",
    "pulsar-client>=3.5,<4",
    "s3fs>=2024.10",
    "paramiko>=3.5",
    "httpx>=0.28,<1",
    "tenacity>=9",
    "jsonpath-ng>=1.7,<2",
    "graphql-core>=3.2,<4",
    "reportlab>=4.2",
    "pillow>=10",
]

[project.optional-dependencies]
full = [
    "docling==2.150.*",
    "easyocr>=1.7,<2",
    "pymssql>=2.3,<3",
    "oracledb>=2",
    "dmPython>=2.5",
    "pyhive[hive_pure_sasl]>=0.7",
    "cassandra-driver>=3.29,<4",
    "happybase>=1.2,<2",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "testcontainers>=4.8",
    "ruff>=0.8",
    "mypy>=1.13",
    "syrupy>=4.8",
    "respx>=0.21",
]

[tool.setuptools]
py-modules = ["main", "schemas", "settings", "security"]

[tool.setuptools.packages.find]
include = ["parsers*", "connectors*", "exporters*", "lake*", "charts*", "pii*"]
namespaces = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "heavy: heavy external database container integration tests (nightly)",
]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "cassandra.*",
    "clickhouse_connect.*",
    "confluent_kafka.*",
    "connectorx.*",
    "defusedxml.*",
    "dmPython.*",
    "docling.*",
    "docx.*",
    "drain3.*",
    "duckdb.*",
    "easyocr.*",
    "elasticsearch.*",
    "genson.*",
    "graphql.*",
    "happybase.*",
    "ijson.*",
    "influxdb_client.*",
    "influxdb_client_3.*",
    "iotdb.*",
    "jsonpath_ng.*",
    "lxml.*",
    "neo4j.*",
    "openpyxl.*",
    "oracledb.*",
    "paho.*",
    "pandera.*",
    "paramiko.*",
    "PIL.*",
    "pptx.*",
    "pulsar.*",
    "pyarrow.*",
    "pyhive.*",
    "pymssql.*",
    "pymysql.*",
    "pypdf.*",
    "python_calamine.*",
    "reportlab.*",
    "s3fs.*",
    "sqlglot.*",
    "syrupy.*",
    "taos.*",
    "taosrest.*",
    "testcontainers.*",
]
ignore_missing_imports = true
