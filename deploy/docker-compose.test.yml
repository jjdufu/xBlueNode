# Integration test auxiliary services (used starting Step 02).
# Reference: docs/blueprint/A6-DEPENDENCY-BASELINE.md §5
name: xbluenode-test
services:
  minio:
    image: minio/minio:latest
    profiles: ["connectors"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: axpoint
      MINIO_ROOT_PASSWORD: axpoint_minio_secret
    ports:
      - "127.0.0.1:19000:9000"

  redis:
    image: redis:8
    profiles: ["connectors"]
    ports:
      - "127.0.0.1:16379:6379"

  redpanda:
    image: redpandadata/redpanda:latest
    profiles: ["connectors"]
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:19092
    ports:
      - "127.0.0.1:19092:19092"

  mosquitto:
    image: eclipse-mosquitto:2
    profiles: ["connectors"]
    ports:
      - "127.0.0.1:11883:1883"
