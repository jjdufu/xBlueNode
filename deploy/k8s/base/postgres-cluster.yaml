apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: xbluenode-pg
  namespace: xbluenode
spec:
  instances: 3
  imageName: pgvector/pgvector:pg16
  minSyncReplicas: 1
  maxSyncReplicas: 2
  postgresql:
    parameters:
      shared_buffers: "2GB"
      max_connections: "200"
      archive_timeout: "60s"
  bootstrap:
    initdb:
      database: xbluenode
      owner: axpoint
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
        - CREATE EXTENSION IF NOT EXISTS pg_trgm;
        - CREATE ROLE axpoint_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
        - CREATE ROLE axpoint_lake LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
  storage:
    size: 200Gi
  backup:
    barmanObjectStore:
      destinationPath: s3://xbluenode-pg-backups/prod
      endpointURL: https://s3.example.com
      s3Credentials:
        accessKeyId:
          name: pg-backup-s3-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: pg-backup-s3-creds
          key: SECRET_ACCESS_KEY
      wal:
        compression: zstd
    retentionPolicy: "14d"
