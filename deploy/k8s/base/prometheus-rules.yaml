apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: xbluenode-alerts
  namespace: xbluenode
spec:
  groups:
    - name: xbluenode.rules
      rules:
        - alert: AxPointOutboxLagHigh
          expr: axpoint_outbox_lag_seconds > 60
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "xBlueNode 事件外发队列延迟超过 60 秒"
        - alert: AxPointJobFailureRateHigh
          expr: rate(axpoint_jobs_total{status="FAILED"}[15m]) > 0.1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "xBlueNode 后台任务失败速率偏高"
        - alert: AxPointHttp5xxRatioHigh
          expr: |
            sum(rate(axpoint_http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(axpoint_http_requests_total[5m])), 1)
            > 0.01
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "xBlueNode HTTP 5xx 错误比例超过 1%"
