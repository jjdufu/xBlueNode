# 复制为集群外托管 Secret（如 ExternalSecrets / SealedSecrets），请勿将真实密钥提交入库
apiVersion: v1
kind: Secret
metadata:
  name: axpoint-secrets
  namespace: xbluenode
type: Opaque
stringData:
  DATABASE_URL: "postgres://axpoint_app:REPLACE_ME@xbluenode-pg-rw:5432/xbluenode"
  MIGRATION_DATABASE_URL: "postgres://axpoint:REPLACE_ME@xbluenode-pg-rw:5432/xbluenode"
  AXPOINT_LAKE_CATALOG_DSN: "postgres://axpoint_lake:REPLACE_ME@xbluenode-pg-rw:5432/xbluenode"
  AXPOINT_INTERNAL_TOKEN: "REPLACE_WITH_RANDOM_URLSAFE_TOKEN_AT_LEAST_32_BYTES"
  AXPOINT_CREDENTIAL_KEYS: "1:REPLACE_WITH_32_BYTE_BASE64_AES256GCM_KEY"
  AXPOINT_MASK_KEYS: "1:REPLACE_WITH_32_BYTE_BASE64_HMAC_MASK_KEY"
  LLM_API_KEY: "REPLACE_WITH_PRODUCTION_LLM_API_KEY"
  EMBED_API_KEY: "REPLACE_WITH_PRODUCTION_EMBED_API_KEY"
---
apiVersion: v1
kind: Secret
metadata:
  name: axpoint-jwt-keys
  namespace: xbluenode
type: Opaque
stringData:
  private.pem: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_ED25519_PKCS8_PRIVATE_KEY
    -----END PRIVATE KEY-----
  1.pem: |
    -----BEGIN PUBLIC KEY-----
    REPLACE_WITH_ED25519_PUBLIC_KEY
    -----END PUBLIC KEY-----
