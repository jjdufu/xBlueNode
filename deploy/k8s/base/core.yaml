apiVersion: apps/v1
kind: Deployment
metadata:
  name: axpoint-core
  namespace: xbluenode
  labels:
    app: axpoint-core
spec:
  replicas: 2
  selector:
    matchLabels:
      app: axpoint-core
  template:
    metadata:
      labels:
        app: axpoint-core
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: axpoint-core
      initContainers:
        - name: migrate
          image: dex2all/axpoint-core:v1.0.0
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: axpoint-config
            - secretRef:
                name: axpoint-secrets
      containers:
        - name: core
          image: dex2all/axpoint-core:v1.0.0
          ports:
            - name: http
              containerPort: 9995
          envFrom:
            - configMapRef:
                name: axpoint-config
            - secretRef:
                name: axpoint-secrets
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/axpoint
            - name: jwt-keys
              mountPath: /etc/axpoint/jwt/private.pem
              subPath: private.pem
              readOnly: true
            - name: jwt-keys
              mountPath: /etc/axpoint/jwt/public/1.pem
              subPath: 1.pem
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: axpoint-data
        - name: jwt-keys
          secret:
            secretName: axpoint-jwt-keys
---
apiVersion: v1
kind: Service
metadata:
  name: axpoint-core
  namespace: xbluenode
spec:
  selector:
    app: axpoint-core
  ports:
    - name: http
      port: 9995
      targetPort: http
