apiVersion: apps/v1
kind: Deployment
metadata:
  name: axpoint-parser
  namespace: xbluenode
  labels:
    app: axpoint-parser
spec:
  replicas: 2
  selector:
    matchLabels:
      app: axpoint-parser
  template:
    metadata:
      labels:
        app: axpoint-parser
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: axpoint-parser
      containers:
        - name: parser
          image: dex2all/axpoint-parser:v1.0.0-full
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: axpoint-config
            - secretRef:
                name: axpoint-secrets
          resources:
            requests:
              cpu: "1"
              memory: "3Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/axpoint
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: axpoint-data
---
apiVersion: v1
kind: Service
metadata:
  name: axpoint-parser
  namespace: xbluenode
spec:
  selector:
    app: axpoint-parser
  ports:
    - name: http
      port: 8001
      targetPort: http
