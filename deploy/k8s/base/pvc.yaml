apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: axpoint-data
  namespace: xbluenode
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 200Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: axpoint-backups
  namespace: xbluenode
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 200Gi
