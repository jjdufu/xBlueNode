# Continuous log collection reference configuration: Fluent Bit -> Kafka (§02.7.4)

[SERVICE]
    Flush        5
    Log_Level    info

[INPUT]
    Name              tail
    Path              /var/log/app/*.log
    Tag               app.logs
    Multiline.Parser  cri, docker, java

[OUTPUT]
    Name        kafka
    Match       app.logs
    Brokers     kafka.example.com:9092
    Topics      app-logs
    Format      json
